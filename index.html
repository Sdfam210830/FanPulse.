<button class="tap" style="left:81.729%;top:84.896%;width:18.271%;height:11.263%" aria-label="Settings" onclick="navigate("Settings")"></button></main><section id="detail"><button onclick="backHome()">← Home</button><h1 id="heading"></h1><p>This button works. This section is a placeholder while we build the live FanPulse features.</p></section><script>const screen=document.getElementById('screen'),detail=document.getElementById('detail');function show(name){if(!name||name==='Home'){screen.style.display='block';detail.style.display='none';return}screen.style.display='none';detail.style.display='block';document.getElementById('heading').textContent=name}function navigate(name){show(name);history.pushState({name},'',name==='Home'?'./':'#'+encodeURIComponent(name))}function backHome(){history.pushState({},'','./');show('Home')}window.addEventListener('popstate',()=>show(decodeURIComponent(location.hash.slice(1))));show(decodeURIComponent(location.hash.slice(1)));if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
